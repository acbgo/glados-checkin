name: 开始每日签到

on:
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: 只读诊断，不签到、不兑换、不推送
        required: false
        default: false
        type: boolean
  schedule:
    # 北京时间 09:30，UTC 01:30
    - cron: 30 1 * * *

concurrency:
  group: glados-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin-job:
    name: Glados Checkin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run checkin
        if: ${{ !inputs.diagnose_only }}
        run: python3 checkin.py
        timeout-minutes: 55
        env:
          GLADOS_CONFIG: ${{ secrets.GLADOS_CONFIG }}
      - name: Read-only diagnosis
        if: ${{ inputs.diagnose_only }}
        run: python3 checkin.py diagnose
        env:
          GLADOS_CONFIG: ${{ secrets.GLADOS_CONFIG }}
