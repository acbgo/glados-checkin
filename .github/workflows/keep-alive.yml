name: Keep Scheduled Workflows Active

on:
  schedule:
    - cron: '23 3 1 * *'
  workflow_dispatch:

concurrency:
  group: glados-keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Update heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/actions-heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/actions-heartbeat
          git commit -m "chore: update actions heartbeat [skip ci]"
          git push origin HEAD:"$GITHUB_REF_NAME"
